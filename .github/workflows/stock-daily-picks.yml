# 台股交易助手：每個交易日早上 8 點前（美股收盤後、台股開盤前）自動選股，並發佈到 GitHub Pages
# 第一次使用：GitHub 專案 Settings → Pages → Build and deployment → Source 選「GitHub Actions」
# 網址：https://<帳號>.github.io/<專案名稱>/stock-journal/
name: 台股每日選股

on:
  schedule:
    - cron: "47 23 * * 0-4"   # UTC 週日～週四 23:47 = 台北 週一～週五 07:47（GitHub 排程可能延遲幾分鐘）
  workflow_dispatch:           # 可在 Actions 頁面手動執行
  push:
    branches: [main]
    paths: ["stock-journal/**", ".github/workflows/stock-daily-picks.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stock-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 執行每日選股
        run: node stock-journal/scripts/daily-picks.js
      - name: 準備網站檔案（維持 /stock-journal/ 網址）
        run: |
          mkdir -p _site
          cp -r stock-journal _site/stock-journal
          echo '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=stock-journal/"><a href="stock-journal/">台股交易助手</a>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
