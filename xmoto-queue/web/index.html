<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#175e4c"><meta name="description" content="出發前，查看店面目前的等候狀況。">
<title>Xmoto 豐原-中正店｜現場等候機車數</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#203c34;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}header,main,footer{width:min(100% - 40px,1000px);margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:30px 0}.brand{font-weight:800;letter-spacing:.08em}.brand span{display:inline-grid;place-items:center;background:#175e4c;color:white;width:34px;height:34px;border-radius:12px;margin-right:10px}.label{font-size:12px;color:#61736b;letter-spacing:.08em}main{padding:45px 0 30px}.eyebrow{color:#648075;font-size:12px;letter-spacing:.18em;font-weight:700}h1{font-size:clamp(32px,6vw,54px);letter-spacing:-.04em;line-height:1.25;margin:15px 0}p{color:#68786f;line-height:1.8}.hero{margin-bottom:35px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.card{border:1px solid #e0e5dc;border-radius:26px;padding:30px;background:#fff}.primary{background:#175e4c;color:#fff;border:none;position:relative;overflow:hidden;min-height:320px}.primary:after{content:"";position:absolute;width:230px;height:230px;border:35px solid #ffffff07;border-radius:50%;right:-80px;bottom:-80px;pointer-events:none}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{border-radius:30px;background:#ffffff19;font-size:12px;padding:7px 12px;display:inline-flex;align-items:center;gap:7px}.dot{width:7px;height:7px;background:#e5ce87;border-radius:50%}.count{font-size:96px;font-weight:600;line-height:1.2;margin:28px 0 8px;letter-spacing:-.05em}.count small{font-size:18px;font-weight:400;margin-left:12px;letter-spacing:0}.primary p{color:#c3d7ce;font-size:13px;margin:0}.primary h2{font-weight:500;font-size:16px;margin:0}.muted{font-size:13px;color:#718078}.side h2{font-size:18px;margin:0 0 22px}.row{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid #edf0e8;font-size:14px}.row:last-of-type{border:0}.row strong{text-align:right;font-weight:600}button{font:inherit;cursor:pointer;border:1px solid #dce4d9;color:#295747;background:#f6f8f2;padding:12px 18px;border-radius:12px;width:100%;margin-top:15px}button:hover{background:#edf1e7}button:focus-visible,a:focus-visible{outline:3px solid #dba84b;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}.notice{display:flex;gap:15px;margin-top:20px;padding:22px 25px;background:#eaeedf;border-radius:18px;font-size:13px;line-height:1.8}.notice strong{display:block;margin-bottom:3px}.notice p{margin:0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:40px 0}.step b{font-size:11px;color:#8b9a89;letter-spacing:.12em}.step h3{font-size:15px;margin:9px 0}.step p{font-size:13px;margin:0}footer{border-top:1px solid #dfe4d9;padding:22px 0 30px;font-size:12px;color:#7a867c;display:flex;justify-content:space-between;gap:20px}a{color:inherit}.demo-banner{background:#fff2ce;color:#705b20;padding:12px 20px;text-align:center;font-size:13px} @media(max-width:650px){header{padding:22px 0}main{padding-top:24px}.grid{grid-template-columns:1fr}.card{padding:25px}.primary{min-height:290px}.steps{grid-template-columns:1fr;gap:22px}.step{display:grid;grid-template-columns:30px 1fr;column-gap:12px}.step b{grid-row:span 2;padding-top:12px}.step h3{margin-bottom:3px}footer{flex-direction:column;gap:8px}.label{font-size:10px}}
</style></head>
<body>
<div id="demo" class="demo-banner" hidden>版面示範中 · 以下數字並非現場機車數 <a href="?">返回正式狀態</a></div>
<header><div class="brand"><span>X</span>Xmoto</div><div class="label">豐原-中正店・等候資訊</div></header>
<main><section class="hero"><div class="eyebrow">A LITTLE CHECK, A BETTER VISIT</div><h1>先看一眼，<br>再安心出發。</h1><p>查看現場等候狀況，讓每一次到訪更從容。</p></section>
<div class="grid"><section class="card primary" aria-labelledby="queue-title"><div class="topline"><h2 id="queue-title">目前等候機車數</h2><span class="pill"><span class="dot"></span><span id="status">尚未連接資料</span></span></div><div class="count" aria-live="polite"><span id="count">—</span><small>台機車等候</small></div><p id="hint">機車台數資料準備中，請以現場狀況為準。</p></section>
<section class="card side"><h2>到訪前的小提醒</h2><div class="row"><span class="muted">預估等待</span><strong id="wait">暫未提供</strong></div><div class="row"><span class="muted">最後更新</span><strong id="updated">尚無資料</strong></div><div class="row"><span class="muted">自動更新</span><strong>每 30 秒</strong></div><button id="refresh" type="button">↻ 重新整理機車台數</button><p id="message" class="muted" role="status">連線後將自動更新，不需重開頁面。</p></section></div>


</main>
<script>
'use strict';
const ui = Object.fromEntries(['count','status','hint','wait','updated','message','refresh','demo'].map(id=>[id,document.getElementById(id)]));
const demo = new URLSearchParams(location.search).get('demo') === '1';
let busy = false;
function empty(status, message) {
  ui.count.textContent='—'; ui.status.textContent=status; ui.wait.textContent='暫未提供';
  ui.hint.textContent='目前無法提供可靠機車台數，請以現場狀況為準。'; ui.message.textContent=message;
}
function render(data) {
  if(data.connected !== true) { ui.updated.textContent='尚無資料'; empty('尚未連接資料','攝影機辨識資料尚未接入。'); return; }
  if(data.open === false) { ui.count.textContent='—'; ui.status.textContent='非營業時間'; ui.wait.textContent='—'; ui.updated.textContent='—';
    ui.hint.textContent='目前為非營業時間，歡迎於營業時間到訪。'; ui.message.textContent='營業時間內將自動恢復顯示。'; return; }
  const time = new Date(data.updatedAt);
  if (!Number.isInteger(data.count) || data.count < 0 || !Number.isFinite(time.getTime())) throw new Error('invalid');
  ui.updated.textContent=time.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  if(Date.now()-time.getTime()>120000 || time.getTime()-Date.now()>60000) { empty('資料已過期','超過 2 分鐘未收到有效資料，已暫停顯示機車台數。'); return; }
  ui.count.textContent=data.count; ui.status.textContent=demo?'示範資料':'資料已更新';
  ui.hint.textContent=data.count===0?'目前未偵測到等候機車，歡迎到訪。':'排隊區域估計機車台數，實際安排請依現場指引。';
  ui.wait.textContent=Number.isFinite(data.estimatedWaitMinutes)&&data.estimatedWaitMinutes>=0?'約 '+Math.ceil(data.estimatedWaitMinutes)+' 分鐘':'暫未提供';
  ui.message.textContent=demo?'這是版面示範，並非現場資料。':'已取得最新資料，將於 30 秒後再次更新。';
}
async function refresh() {
  if(busy) return; busy=true; ui.refresh.disabled=true;
  try {
    if(demo) render({connected:true,count:8,updatedAt:new Date().toISOString(),estimatedWaitMinutes:null});
    else { const response=await fetch('./status.json?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(10000)}); if(!response.ok) throw new Error('http'); render(await response.json()); }
  } catch { empty('暫時無法更新','連線失敗或資料格式錯誤，稍後將自動重試。'); }
  finally { busy=false; ui.refresh.disabled=false; }
}
ui.demo.hidden=!demo; ui.refresh.addEventListener('click',refresh); refresh(); setInterval(refresh,30000);

</script></body></html>
