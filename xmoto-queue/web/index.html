<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#175e4c">
<title>Xmoto 豐原-中正店｜現場狀況</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f6f5ef;color:#203c34;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;display:flex;flex-direction:column}
header,main{width:min(100% - 40px,760px);margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 0}
.brand{font-weight:800;letter-spacing:.08em}
.brand span{display:inline-grid;place-items:center;background:#175e4c;color:#fff;width:34px;height:34px;border-radius:12px;margin-right:10px}
.label{font-size:13px;color:#61736b}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-content:start;padding:20px 0 40px}
.card{border-radius:26px;padding:30px;background:#fff;border:1px solid #e0e5dc;min-height:240px;display:flex;flex-direction:column}
.card h2{margin:0;font-size:16px;font-weight:600;color:#61736b}
.big{flex:1;display:flex;align-items:center;font-size:72px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.big small{font-size:20px;font-weight:500;margin-left:10px;letter-spacing:0}
.queue{background:#175e4c;border:none;color:#fff}
.queue h2{color:#c3d7ce}
.machines{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center}
.m{display:flex;align-items:center;gap:14px;font-size:40px;font-weight:700}
.m .dot{width:22px;height:22px;border-radius:50%;background:#c9cfc8;flex:none}
.m .name{font-size:15px;font-weight:500;color:#61736b;display:block}
.busy .dot{background:#d9534f;box-shadow:0 0 0 6px #d9534f22}.busy .state{color:#b8322d}
.free .dot{background:#2e9d68;box-shadow:0 0 0 6px #2e9d6822}.free .state{color:#1f7f52}
.unknown .state{color:#9aa59e}
.foot{grid-column:1/-1;text-align:center;font-size:12px;color:#8b978f}
.demo-banner{background:#fff2ce;color:#705b20;padding:10px 20px;text-align:center;font-size:13px}
@media(max-width:600px){main{grid-template-columns:1fr}.card{min-height:180px;padding:24px}.big{font-size:64px}}
</style></head>
<body>
<div id="demo" class="demo-banner" hidden>版面示範中 · 以下並非現場資料 <a href="?">返回</a></div>
<header><div class="brand"><span>X</span>Xmoto</div><div class="label">豐原-中正店</div></header>
<main>
  <section class="card"><h2>機器狀態</h2><div class="machines" id="machines" aria-live="polite"></div></section>
  <section class="card queue"><h2>現場等待機車</h2><div class="big" aria-live="polite"><span id="count">—</span><small>台</small></div></section>
  <p class="foot" id="foot">讀取中…</p>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const demo = new URLSearchParams(location.search).get('demo') === '1';
const STALE_MS = 120000;

function machinesHTML(list, fallback) {
  if (!list || !list.length) list = [{ name: '機器', inUse: null }];
  const one = list.length === 1;
  return list.map(m => {
    const cls = m.inUse === true ? 'busy' : m.inUse === false ? 'free' : 'unknown';
    const text = m.inUse === true ? '使用中' : m.inUse === false ? '空閒' : fallback;
    const name = one ? '' : `<span class="name">${String(m.name).replace(/[<>&]/g, '')}</span>`;
    return `<div class="m ${cls}"><span class="dot"></span><span>${name}<span class="state">${text}</span></span></div>`;
  }).join('');
}
function unknown(text, foot) {
  $('count').textContent = '—';
  $('machines').innerHTML = machinesHTML(null, text);
  $('foot').textContent = foot;
}
function render(d) {
  if (d.connected !== true) return unknown('—', '尚未連接資料');
  if (d.open === false) return unknown('休息中', '目前為非營業時間');
  const t = new Date(d.updatedAt);
  if (!Number.isInteger(d.count) || d.count < 0 || !Number.isFinite(t.getTime())) throw new Error('invalid');
  if (Date.now() - t.getTime() > STALE_MS) return unknown('—', '暫時無法取得現場資料，請以現場狀況為準');
  $('count').textContent = d.count;
  $('machines').innerHTML = machinesHTML(d.machines, '—');
  $('foot').textContent = (demo ? '示範資料 · ' : '') + '更新於 ' +
    t.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false }) + ' · 每 30 秒自動更新';
}
async function refresh() {
  try {
    if (demo) return render({ connected: true, count: 3, machines: [{ name: '機器', inUse: true }], updatedAt: new Date().toISOString() });
    const r = await fetch('./status.json?t=' + Date.now(), { cache: 'no-store', signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error('http');
    render(await r.json());
  } catch { unknown('—', '暫時無法更新，稍後自動重試'); }
}
$('demo').hidden = !demo;
refresh(); setInterval(refresh, 30000);
</script></body></html>
